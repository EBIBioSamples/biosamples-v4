<div th:fragment="footer">

        <!--
              <div id="local-footer">
                <div class="row">
                  <span class="reference">How to reference this page: ...</span>
                </div>

         -->
        <div id="elixir-banner" data-color="grey" data-name="BioSamples Database"
             data-description="BioSamples is an Elixir Deposition Database"
             data-more-information-link="https://www.elixir-europe.org/platforms/data/elixir-deposition-databases"
             data-use-basic-styles="false"></div>
        <!-- End optional local footer -->
        <div id="global-footer" class="global-footer">
            <nav id="global-nav-expanded" class="row global-nav-expanded">
                <!-- Footer will be automatically inserted by footer.js -->
            </nav>

            <section id="ebi-footer-meta" class="row ebi-footer-meta">
                <!-- Footer meta will be automatically inserted by footer.js -->
            </section>
        </div>
    </footer>


    <!-- JavaScript -->

    <!-- Grab Google CDN's jQuery, with a protocol relative URL; fall back to local if offline -->
    <!--
    <script>window.jQuery || document.write('<script src="../js/libs/jquery-1.10.2.min.js"><\/script>')</script>
    -->
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/1.10.2/jquery.min.js"></script>
    <!-- Your custom JavaScript file scan go here... change names accordingly -->
    <!--
      <script defer="defer" src="//www.ebi.ac.uk/web_guidelines/js/plugins.js"></script>
      <script defer="defer" src="//www.ebi.ac.uk/web_guidelines/js/script.js"></script>
    -->
    <script defer="defer"
            src="https://ebi.emblstatic.net/web_guidelines/EBI-Framework/v1.3/js/elixirBanner.js"></script>
    <script defer="defer" th:src="@{/js/jquery.autocomplete.min.js}"></script>
    <script defer="defer" th:src="@{/js/facets-ajax.js}"></script>
    <script defer="defer" th:src="@{/js/draw-graphs.js}"></script>
    <script defer="defer" th:src="@{/js/graph-search.js}"></script>
    <script th:src="@{/webjars/jquery/jquery.min.js}"></script>
    <script th:src="@{/webjars/popper.js/umd/popper.min.js}"></script>
    <script th:src="@{/webjars/bootstrap/js/bootstrap.min.js}"></script>
    <script th:src="@{/js/dropzone.js}"></script>
    <script th:src="@{/js/download2.js}"></script>
    <script th:src="@{/js/toastr.min.js}"></script>
    <script th:src="@{/js/chart.min.js}"></script>
    <script th:src="@{/js/index-chart.js}"></script>

    <script th:inline="javascript">
        $(document).ready(function () {
            let $filterApplyButton = $("#filter-apply");
            let $filterClearButton = $("#filter-clear");
            let $filtersCheckboxes = $(".facet-checkbox");
            let $originalState = [];
            let $changeState = [];

            $(".facet").each(function (index, elem) {
                $originalState[index] = $(elem).hasClass("secondary");
                $changeState[index] = $originalState[index];
            });

            $filtersCheckboxes.each(function (index, elem) {
                $(elem).on("click", function () {
                    $changeState[index] = !$changeState[index];
                    if (!equals($originalState, $changeState)) {
                        $filterApplyButton.prop('disabled', false);
                    } else {
                        $filterApplyButton.prop('disabled', true);
                    }
                })
            });

            function equals(array1, array2) {
                return array1.toString() === array2.toString();
            }

        });
    </script>

    <script defer="defer" src="https://ebi.emblstatic.net/web_guidelines/EBI-Framework/v1.3/js/script.js"></script>
    <!-- The Foundation theme JavaScript -->
    <script src="https://ebi.emblstatic.net/web_guidelines/EBI-Framework/v1.3/libraries/foundation-6/js/foundation.js"></script>
    <script src="https://ebi.emblstatic.net/web_guidelines/EBI-Framework/v1.3/js/foundationExtendEBI.js"></script>
    <script type="text/JavaScript">$(document).foundation();</script>
    <script type="text/JavaScript">$(document).foundationExtendEBI();</script>
    <script type="text/JavaScript">
        // After the EMBL-EBI footer has rendered, point its privacy link(s)
        // to the BioSamples submissions privacy notice PDF.
        (function () {
            function updateFooterPrivacyLinks() {
                // First, handle any known EMBL-EBI public website privacy notice links.
                var anchors = document.querySelectorAll('a[href*="data-protection/privacy-notice/embl-ebi-public-website"]');
                for (var i = 0; i < anchors.length; i++) {
                    anchors[i].setAttribute("href", "/biosamples/privacy/biosamples-submissions-privacy-notice.pdf");
                    anchors[i].setAttribute("target", "_blank");
                    anchors[i].setAttribute("rel", "noopener noreferrer");
                }

                // Fallback: update any other footer privacy/data-protection links if present.
                var container = document.getElementById("ebi-footer-meta") || document.getElementById("global-footer");
                if (!container) {
                    return;
                }
                var footerAnchors = container.getElementsByTagName("a");
                for (var j = 0; j < footerAnchors.length; j++) {
                    var href2 = footerAnchors[j].getAttribute("href") || "";
                    if (href2.indexOf("privacy") !== -1 || href2.indexOf("data-protection") !== -1) {
                        footerAnchors[j].setAttribute("href", "/biosamples/privacy/biosamples-submissions-privacy-notice.pdf");
                        footerAnchors[j].setAttribute("target", "_blank");
                        footerAnchors[j].setAttribute("rel", "noopener noreferrer");
                    }
                }
            }

            // Run after the footer scripts; retry a couple of times in case of async load.
            function scheduleUpdates() {
                updateFooterPrivacyLinks();
                setTimeout(updateFooterPrivacyLinks, 1000);
                setTimeout(updateFooterPrivacyLinks, 3000);
            }

            if (document.readyState === "complete" || document.readyState === "interactive") {
                scheduleUpdates();
            } else {
                document.addEventListener("DOMContentLoaded", scheduleUpdates);
            }
        })();
    </script>
</div>
</body>

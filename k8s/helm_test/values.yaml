global:
  imageRegistry: ""
  imagePullSecrets: []
  storageClass: ""

# Long-running services (Deployments)
services:
  webapp-core:
    enabled: true
    replicaCount: 2
    image:
      repository: ""
      tag: ""
      pullPolicy: IfNotPresent
    service:
      type: ClusterIP
      port: 8080
      targetPort: 8080
#    ingress:
#      enabled: true
#      className: "nginx"
#      hosts:
#        - host: biosamples-core.example.com
#          paths:
#            - path: /
#              pathType: Prefix
    resources:
      limits:
        cpu: 1000m
        memory: 1Gi
      requests:
        cpu: 500m
        memory: 512Mi

  webapp-core-v2:
    enabled: true
    replicaCount: 2

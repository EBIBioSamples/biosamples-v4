# Batch Jobs (run-to-completion)
jobs:
  pipelines-reindex:
    enabled: false  # Only run when explicitly enabled
    image:
      repository: ""
      tag: ""
      pullPolicy: IfNotPresent
    backoffLimit: 3
    restartPolicy: Never
    ttlSecondsAfterFinished: 3600  # Clean up job after 1 hour
    resources:
      limits:
        cpu: 1000m
        memory: 1Gi
      requests:
        cpu: 500m
        memory: 512Mi
    env:
      - name: JOB_TYPE
        value: "reindex"

  pipelines-curation:
    enabled: false  # Only run when explicitly enabled
    image:
      repository: ""
      tag: ""
      pullPolicy: IfNotPresent
    backoffLimit: 3
    restartPolicy: Never
    ttlSecondsAfterFinished: 3600  # Clean up job after 1 hour
    resources:
      limits:
        cpu: 1000m
        memory: 1Gi
      requests:
        cpu: 500m
        memory: 512Mi
    env:
      - name: JOB_TYPE
        value: "curation"

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}

podSecurityContext: {}

securityContext: {}

nodeSelector: {}

tolerations: []

affinity: {}

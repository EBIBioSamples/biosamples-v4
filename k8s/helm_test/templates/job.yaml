{{- range $jobName, $config := .Values.jobs }}
{{- if $config.enabled }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "biosamples.fullname" $ }}-{{ $jobName }}-{{ now | date "20060102-150405" }}
  labels:
    {{- include "biosamples.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $jobName }}
    job-type: {{ $jobName }}
  annotations:
    deployment-timestamp: {{ now | quote }}
spec:
  backoffLimit: {{ $config.backoffLimit | default 3 }}
  {{- if $config.ttlSecondsAfterFinished }}
  ttlSecondsAfterFinished: {{ $config.ttlSecondsAfterFinished }}
  {{- end }}
  template:
    metadata:
      annotations:
        {{- with $.Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "biosamples.selectorLabels" $ | nindent 8 }}
        app.kubernetes.io/component: {{ $jobName }}
        job-type: {{ $jobName }}
    spec:
      {{- with $.Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "biosamples.serviceAccountName" $ }}
      securityContext:
        {{- toYaml $.Values.podSecurityContext | nindent 8 }}
      restartPolicy: {{ $config.restartPolicy | default "Never" }}
      containers:
        - name: {{ $jobName }}
          securityContext:
            {{- toYaml $.Values.securityContext | nindent 12 }}
          image: "{{ $config.image.repository | default $.Values.global.imageRegistry }}/{{ $jobName }}:{{ $config.image.tag | default $.Chart.AppVersion }}"
          imagePullPolicy: {{ $config.image.pullPolicy | default "IfNotPresent" }}
          resources:
            {{- toYaml $config.resources | nindent 12 }}
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "kubernetes"
            - name: JOB_NAME
              value: {{ $jobName }}
            {{- with $config.env }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      {{- with $.Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $.Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $.Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
{{- end }}
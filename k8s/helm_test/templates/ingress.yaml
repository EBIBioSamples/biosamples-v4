{{- range $serviceName, $config := .Values.services }}
{{- if and $config.enabled $config.ingress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "biosamples.fullname" $ }}-{{ $serviceName }}
  labels:
    {{- include "biosamples.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $serviceName }}
  {{- with $config.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if $config.ingress.className }}
  ingressClassName: {{ $config.ingress.className }}
  {{- end }}
  {{- if $config.ingress.tls }}
  tls:
    {{- range $config.ingress.tls }}
    - hosts:
        {{- range .hosts }}
        - {{ . | quote }}
        {{- end }}
      secretName: {{ .secretName }}
    {{- end }}
  {{- end }}
  rules:
    {{- range $config.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path }}
            {{- if .pathType }}
            pathType: {{ .pathType }}
            {{- end }}
            backend:
              service:
                name: {{ include "biosamples.fullname" $ }}-{{ $serviceName }}
                port:
                  number: {{ $config.service.port | default 8080 }}
          {{- end }}
    {{- end }}
{{- end }}
{{- end }}
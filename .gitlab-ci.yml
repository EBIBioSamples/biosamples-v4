.kube_deploy_script:
  stage: deploy
  image: dtzar/helm-kubectl:3.16
  tags: ["dind"]
  services:
    - docker:27-dind
  script:
    - echo $K8S_NAMESPACE
    - kubectl config view
    - kubectl config set-context --current --namespace=${K8S_NAMESPACE}
    - kubectl delete secret $DOCKER_PULL_SECRET || true
    - |
      kubectl create secret docker-registry $DOCKER_PULL_SECRET \
              --docker-server=$CI_REGISTRY \
              --docker-username=$CI_REGISTRY_USER \
              --docker-password=$CI_REGISTRY_PASSWORD
    - |
      helm upgrade --install $APP_NAME ./k8s/helm \
                   --values ./k8s/helm/values-${ENVIRONMENT_NAME}.yaml \
                   --set "imagePullSecrets[0].name=$DOCKER_PULL_SECRET" \
                   --set image.repository=$CI_REGISTRY_IMAGE/webapp-core \
                   --set image.tag=$DOCKER_TAG
    - |
      helm upgrade --install ${APP_NAME}-v2 ./k8s/helm \
                   --values ./k8s/helm/values-${ENVIRONMENT_NAME}.yaml \
                   --set "imagePullSecrets[0].name=$DOCKER_PULL_SECRET" \
                   --set image.repository=$CI_REGISTRY_IMAGE/webapp-core-v2 \
                   --set image.tag=$DOCKER_TAG
    - |
      helm upgrade --install ${APP_NAME}-v2 ./k8s/helm \
                   --values ./k8s/helm/values-${ENVIRONMENT_NAME}.yaml \
                   --set "imagePullSecrets[0].name=$DOCKER_PULL_SECRET" \
                   --set image.repository=$CI_REGISTRY_IMAGE/webapp-core-v2 \
                   --set image.tag=$DOCKER_TAG

.kube_deploy_jobs_script:
  stage: deploy
  image: dtzar/helm-kubectl:3.16
  tags: [ "dind" ]
  services:
    - docker:27-dind
  script:
    - echo $K8S_NAMESPACE
    - kubectl config set-context --current --namespace=${K8S_NAMESPACE}
    - kubectl delete secret $DOCKER_PULL_SECRET || true
    - |
      kubectl create secret docker-registry $DOCKER_PULL_SECRET \
              --docker-server=$CI_REGISTRY \
              --docker-username=$CI_REGISTRY_USER \
              --docker-password=$CI_REGISTRY_PASSWORD
    - |
      helm upgrade --install biosamples-reindex ./k8s/jobs \
                   --values ./k8s/jobs/values-${ENVIRONMENT_NAME}.yaml \
                   --set "imagePullSecrets[0].name=$DOCKER_PULL_SECRET" \
                   --set image.repository=$CI_REGISTRY_IMAGE/pipelines-reindex \
                   --set image.tag=$DOCKER_TAG

